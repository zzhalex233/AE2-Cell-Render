repositories {
    maven {
        name = 'CleanroomMC'
        url = 'https://maven.cleanroommc.com'
    }
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
    }
    maven {
        name = 'CleanroomCurseMaven'
        url = 'https://curse.cleanroommc.com'
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
    }
    mavenCentral()
    mavenLocal() // Must be last for caching to work
}

dependencies {
    compileOnly "com.cleanroommc:sponge-mixin:0.20.13+mixin.0.8.7"
    compileOnly "zone.rong:mixinbooter:${mixin_booter_version}"

    if (enable_lwjglx.toBoolean()) {
        compileOnly "com.cleanroommc:lwjglx:1.0.0"
    }
    if (use_asset_mover.toBoolean()) {
        implementation "com.cleanroommc:assetmover:${asset_mover_version}"
    }
    if (enable_junit_testing.toBoolean()) {
        testImplementation 'org.junit.jupiter:junit-jupiter:5.7.1'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
        testImplementation 'io.netty:netty-buffer:4.1.94.Final'
    }

    modImplementation "curse.maven:ae2-extended-life-570458:6302098"
    modImplementation "curse.maven:crazyae-1111042:6840104"
    modImplementation "curse.maven:ae-additions-extra-cells-2-fork-493962:3814371"
    modImplementation "curse.maven:forgelin-continuous-456403:7700023"
    modImplementation "curse.maven:mekanism-ce-unofficial-840735:7680340"
    modImplementation "curse.maven:mekanism-energistics-1027681:5775101"
    modImplementation "curse.maven:ex-pattern-provider-892005:4773929"
}
